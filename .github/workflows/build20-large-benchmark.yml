name: BUILD 20 Large Universe Benchmark

on:
  push:
    branches:
      - benchmark/build20-large-universe

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Run 50k Logical Universe benchmark
        run: |
          set -euo pipefail
          python benchmarks/build20_large_universe_benchmark.py | tee /tmp/build20-large-result.json
