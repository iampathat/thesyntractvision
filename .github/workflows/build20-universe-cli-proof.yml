name: BUILD 20 Universe CLI Proof

on:
  push:
    branches: ["test/build20-universe-cli-proof"]

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run universe twice and verify overlay isolation
        run: |
          set -euo pipefail
          rm -rf /tmp/qcds-build20-proof
          qcds-universe examples/logical_universe_lawbook_mvp.json --store /tmp/qcds-build20-proof > /tmp/run1.json
          qcds-universe examples/logical_universe_lawbook_mvp.json --store /tmp/qcds-build20-proof > /tmp/run2.json
          python - <<'PY'
          import csv, json
          from pathlib import Path

          r1 = json.loads(Path('/tmp/run1.json').read_text())
          r2 = json.loads(Path('/tmp/run2.json').read_text())

          assert r1['universe_id'] == 'swedish-lawbook-mvp'
          assert r1['universe_mode'] == 'declared'
          assert r1['base_binding_count'] == 3
          assert r1['active_rule_count'] == 1
          assert r1['added_bindings'] == 3
          assert r1['mvp_boundary']['overlay_only'] is True
          assert r1['mvp_boundary']['qcds_core_modified'] is False

          q1 = {q['query_id']: q for q in r1['syntractfilter_results']}
          assert q1['humans']['match_count'] == 2
          assert q1['legal-persons']['match_count'] == 2
          assert q1['dogs']['match_count'] == 1

          assert r2['added_bindings'] == 0
          assert r2['active_rule_count'] == 1
          assert r2['rule_outcomes'][0]['status'] == 'already_active'

          space = Path('/tmp/qcds-build20-proof/universes/swedish-lawbook-mvp/logical_space.csv')
          rows = list(csv.DictReader(space.open(encoding='utf-8')))
          assert len(rows) == 3
          all_terms = [tuple(json.loads(row['terms'])) for row in rows]
          assert all('legal person' not in terms for terms in all_terms)
          assert all('legal_person' not in terms for terms in all_terms)

          print('BUILD20_UNIVERSE_CLI_PROOF_OK')
          print('run1_added_bindings=', r1['added_bindings'])
          print('run2_added_bindings=', r2['added_bindings'])
          print('legal_person_matches=', q1['legal-persons']['match_count'])
          print('base_rows=', len(rows))
          print('derived_logic_materialized=', False)
          PY
