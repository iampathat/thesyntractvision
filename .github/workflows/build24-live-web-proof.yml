name: BUILD 24 Live Public Web Proof
on:
  push:
    branches: [test/build24-live-web]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run live public-web Reality proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qcds-build24-live
          qcds-reality-web examples/public_web_reality_capital_mvp.json --store /tmp/qcds-build24-live > /tmp/build24-live.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          result = json.loads(Path('/tmp/build24-live.json').read_text())
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['oracle_gap_count'] == 1
          assert result['rival_hypothesis_count'] > 1
          assert result['evidence_plan_count'] == 2
          assert result['robot_observation_count'] >= 3
          assert result['challenge_case_count'] >= 3
          assert result['status'] in {'expanded', 'quarantined'}
          rr = result['reality_result']
          assert rr is not None
          outcomes = rr['governed_rule_outcomes']
          assert outcomes
          winner = outcomes[0]
          print('BUILD24_LIVE_PUBLIC_WEB_PROOF_OK')
          print('status=', result['status'])
          print('observations=', result['robot_observation_count'])
          print('sources=', result['robot_source_ids'])
          print('rule=', winner['antecedent']['value'], '=>', winner['consequent']['value'])
          print('knowledge_gain=', rr['knowledge_gain'])
          assert winner['antecedent']['value'] == 'france'
          assert winner['consequent']['value'] == 'paris'
          PY
