name: BUILD 26-28 Living Robot Proof

on:
  push:
    branches: [implementation/build-26-28-living-robot]
    paths:
      - ".github/workflows/build26-28-proof.yml"
      - "src/qcds_fabric/living_logical_space.py"
      - "src/qcds_fabric/logical_robot_control.py"
      - "src/qcds_fabric/living_robot_ui.py"
      - "src/qcds_fabric/logical_robot_live.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: Seed transparent Reality store
        run: |
          python - <<'PY'
          from qcds_fabric.logical_space import CsvLogicalSpace, LogicalBinding
          from qcds_fabric.logical_transform import CsvLogicalTransformStore, LogicalTransformRule
          root='/tmp/qcds-living-proof'
          CsvLogicalSpace(root).append([
            LogicalBinding('b1',('alice','human'),'proof',1.0),
            LogicalBinding('b2',('bob','human'),'proof',1.0),
            LogicalBinding('b3',('fido','dog'),'proof',1.0),
          ])
          CsvLogicalTransformStore(root).install(LogicalTransformRule('r1',('human',),('happy',),'proof-rule'))
          PY
      - name: Start real Living Logical Robot server
        run: |
          nohup qcds-live --host 127.0.0.1 --port 8765 --store /tmp/qcds-living-proof --frontier examples/continuous_reality_growth_mvp.json --no-browser >/tmp/qcds-live.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ | grep -q "Living Logical Space"
          curl -fsS http://127.0.0.1:8765/api/space >/tmp/space.json
          curl -fsS http://127.0.0.1:8765/api/control >/tmp/control.json
      - name: Send I/O and grow robot frontier from real public web
        run: |
          curl -fsS -X POST http://127.0.0.1:8765/api/input -H 'content-type: application/json' -d '{"kind":"dialogue","payload":{"text":"What color is the car?"}}' >/tmp/dialogue.json
          curl -fsS -X POST http://127.0.0.1:8765/api/input -H 'content-type: application/json' -d '{"kind":"explore_domain","payload":{"text":"quantum biology","priority":20}}' >/tmp/explore.json
          curl -fsS -X POST http://127.0.0.1:8765/api/process-one -H 'content-type: application/json' -d '{}' >/tmp/process.json
          curl -fsS http://127.0.0.1:8765/api/frontier >/tmp/frontier.json
          curl -fsS http://127.0.0.1:8765/api/events?after=0 >/tmp/events.json
      - name: Export Pages manifestation
        run: |
          python -m qcds_fabric.living_robot_ui --export /tmp/index.html
          grep -q "RECORDED VERIFIED PROOF" /tmp/index.html
      - name: Assert proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          space=json.loads(Path('/tmp/space.json').read_text())
          dialogue=json.loads(Path('/tmp/dialogue.json').read_text())
          frontier=json.loads(Path('/tmp/frontier.json').read_text())['frontier']
          events=json.loads(Path('/tmp/events.json').read_text())['events']
          assert space['counts']=={'bindings':3,'logical_terms':5,'active_rules':1}
          assert any(e['kind']=='rule' and e['source']=='human' and e['target']=='happy' for e in space['edges'])
          assert dialogue['truth_effect']==0
          assert any(x['source']=='logical_robot' and x['kind']=='visit_url' for x in frontier)
          assert any(e['event_type']=='domain_exploration_observed' for e in events)
          assert Path('/tmp/index.html').stat().st_size > 10000
          print('BUILD26_28_LIVING_ROBOT_PROOF_OK')
          print('graph_nodes=',len(space['nodes']))
          print('graph_edges=',len(space['edges']))
          print('frontier_items=',len(frontier))
          print('events=',len(events))
          print('dialogue_truth_effect=',dialogue['truth_effect'])
          PY
