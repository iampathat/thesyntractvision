name: Cally.One Tribute tests

on:
  push:
    branches: [tribute]
  pull_request:
    paths:
      - "src/qcds_fabric/robots/cally_one/**"
      - "src/qcds_fabric/calendar_robot.py"
      - "src/qcds_fabric/calendar_robot_ui.py"
      - "src/qcds_fabric/calendar_robot_live.py"
      - "src/qcds_fabric/cally_one.py"
      - "src/qcds_fabric/cally_one_ui.py"
      - "web/session_core_worker.js"
      - "tests/test_calendar_robot.py"
      - "tests/test_cally_one_brand.py"
      - "LICENSE_CALENDAR_TRIBUTE.md"
      - "CALENDAR_ROBOT.md"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Run Cally.One Logical Robot tests
        run: pytest -q tests/test_calendar_robot.py tests/test_cally_one_brand.py
      - name: Build static Cally.One GitHub preview
        run: |
          mkdir -p _cally_preview/cally
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          from qcds_fabric.robots.cally_one.enhanced_ui import cally_one_html

          out = Path('_cally_preview')
          (out / 'cally' / 'index.html').write_text(cally_one_html(static_mode=True), encoding='utf-8')
          (out / 'session_core_worker.js').write_text(Path('web/session_core_worker.js').read_text(encoding='utf-8'), encoding='utf-8')
          root = Path('src/qcds_fabric')
          with ZipFile(out / 'qcds_fabric.zip', 'w', compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.suffix in {'.py', '.json', '.md'}:
                      archive.write(path, path.relative_to('src'))

          html = (out / 'cally' / 'index.html').read_text(encoding='utf-8')
          worker = (out / 'session_core_worker.js').read_text(encoding='utf-8')
          assert "new Worker('../session_core_worker.js')" in html
          assert "new URL('../qcds_fabric.zip'" in html
          assert 'Cally.One' in html
          assert 'cally_one_run' in html
          assert 'data-cally-enhancements' in html
          assert 'eventMove' in html
          assert 'resizeHandle' in html
          assert 'eventEdit' in html
          assert 'timeline[style*="--days:1"]' in html
          assert 'qcds_fabric.robots.cally_one.robot' in worker
          assert (out / 'qcds_fabric.zip').stat().st_size > 0
          PY
      - name: Validate Cally.One browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('_cally_preview/cally/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          assert len(scripts) >= 3, len(scripts)
          out = Path('_cally_preview/js-check')
          out.mkdir(parents=True, exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f'inline-{index}.js').write_text(script, encoding='utf-8')
          PY
          for file in _cally_preview/js-check/*.js; do node --check "$file"; done
          node --check _cally_preview/session_core_worker.js
      - name: Upload Cally.One preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cally-one-preview
          path: _cally_preview
