name: Cally ChatGPT Logical Robot

on:
  push:
    branches: [cally-chatgpt-work]
    paths:
      - "src/qcds_fabric/robots/cally_chatgpt/**"
      - "src/qcds_fabric/hosted_runtime.py"
      - "src/qcds_fabric/hosted_runtime_mcp.py"
      - "src/qcds_fabric/hosted_robotics.py"
      - "plugins/cally-chatgpt/**"
      - "tests/test_cally_chatgpt_robot.py"
      - "tests/test_qcds_hosted_runtime.py"
      - "pyproject.toml"
      - ".github/workflows/cally-chatgpt.yml"
  pull_request:
    paths:
      - "src/qcds_fabric/robots/cally_chatgpt/**"
      - "src/qcds_fabric/hosted_runtime.py"
      - "src/qcds_fabric/hosted_runtime_mcp.py"
      - "src/qcds_fabric/hosted_robotics.py"
      - "plugins/cally-chatgpt/**"
      - "tests/test_cally_chatgpt_robot.py"
      - "tests/test_qcds_hosted_runtime.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  chatgpt-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install test + ChatGPT MCP extras
        run: python -m pip install -e '.[test,chatgpt]'
      - name: Test ChatGPT boundary and hosted QCDS runtime
        run: pytest -q tests/test_cally_chatgpt_robot.py tests/test_qcds_hosted_runtime.py
      - name: Compile ChatGPT and hosted runtime packages
        run: |
          python -m compileall -q src/qcds_fabric/robots/cally_chatgpt
          python -m py_compile src/qcds_fabric/hosted_runtime.py src/qcds_fabric/hosted_runtime_mcp.py src/qcds_fabric/hosted_robotics.py
      - name: Construct five-port MCP server on shared hosted runtime
        run: |
          python - <<'PY'
          from qcds_fabric.robots.cally_chatgpt.mcp_server import create_mcp_server, hosted_runtime_descriptor
          from qcds_fabric.robots.cally_chatgpt.interface import INTERFACE_VERBS
          server = create_mcp_server()
          manifest = hosted_runtime_descriptor()
          assert server is not None
          assert INTERFACE_VERBS == ('read','write','query','project','resolve')
          assert manifest['system_boundary'] == 'SyntractSystem'
          assert manifest['single_qcds_architecture'] is True
          assert {item['robot_id'] for item in manifest['robots']} == {'cally', 'robotics-route'}
          print('CALLY CHATGPT MCP READY:', INTERFACE_VERBS, manifest['contract'])
          PY
      - name: Construct standalone hosted QCDS MCP transport
        run: |
          python - <<'PY'
          from qcds_fabric.hosted_runtime import HostedQCDSRuntime
          from qcds_fabric.hosted_runtime_mcp import create_hosted_runtime_mcp
          from qcds_fabric.hosted_robotics import hosted_robotics_adapter
          from qcds_fabric.robots.cally_chatgpt.hosted_adapter import hosted_cally_adapter
          runtime = HostedQCDSRuntime()
          runtime.register(hosted_cally_adapter())
          runtime.register(hosted_robotics_adapter())
          server = create_hosted_runtime_mcp(runtime)
          assert server is not None
          assert {item['robot_id'] for item in runtime.descriptor()['robots']} == {'cally', 'robotics-route'}
          print('HOSTED QCDS MCP READY:', runtime.descriptor()['contract'])
          PY
      - name: Validate OpenAI plugin package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('plugins/cally-chatgpt')
          manifest = json.loads((root / '.codex-plugin' / 'plugin.json').read_text(encoding='utf-8'))
          assert manifest['name'] == 'cally-logical-robot'
          assert manifest['skills'] == './skills/'
          assert manifest['interface']['developerName'] == 'Patrik Sundblom'
          skill = (root / 'skills' / 'cally-calendar' / 'SKILL.md').read_text(encoding='utf-8')
          for verb in ('read', 'write', 'query', 'project', 'resolve'):
              assert f'`{verb}`' in skill
          assert 'QCDS by Patrik Sundblom / The Syntract Vision' in skill
          # .app.json is intentionally absent until ChatGPT creates a real
          # plugin_asdk_app... MCP connection ID in developer mode.
          assert not (root / '.app.json').exists()
          print('OPENAI PLUGIN PACKAGE READY FOR MCP CONNECTION REGISTRATION')
          PY
      - name: Build static ChatGPT calendar projection
        run: |
          mkdir -p _chatgpt_preview/cally-chatgpt
          python - <<'PY'
          from pathlib import Path
          from qcds_fabric.robots.cally_chatgpt.chatgpt_projection import cally_chatgpt_html
          html = cally_chatgpt_html(static_mode=True)
          out = Path('_chatgpt_preview/cally-chatgpt/index.html')
          out.write_text(html, encoding='utf-8')
          assert 'data-cally-chatgpt-interface' in html
          assert 'logical-robot-interface/v1' in html
          assert 'window.__callyChatGPT' in html
          assert 'resolve -> QCDS -> Syntract' in html
          PY
      - name: Validate ChatGPT interface JavaScript syntax
        run: node --check src/qcds_fabric/robots/cally_chatgpt/chatgpt_interface.js
