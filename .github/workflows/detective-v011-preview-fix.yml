name: Patch Detective v0.11 fixed camera preview

on:
  push:
    paths:
      - '.github/workflows/detective-v011-preview-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fixed preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/detective/index.html')
          s=p.read_text()
          old='.camera video{width:100%;height:100%;object-fit:contain;background:#000}'
          new='.camera video{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;background:#000}'
          if old not in s:
              raise SystemExit('camera video rule not found')
          s=s.replace(old,new,1)
          old='@media(max-width:540px){.wrap{padding-left:8px;padding-right:8px}.card{border-radius:18px;padding:10px}.camera{min-height:58vh;aspect-ratio:auto}'
          new='@media(max-width:540px){.wrap{padding-left:8px;padding-right:8px}.card{border-radius:18px;padding:10px}.camera{height:min(58vh,560px);min-height:0;max-height:58vh;aspect-ratio:auto}'
          if old not in s:
              raise SystemExit('mobile camera rule not found')
          s=s.replace(old,new,1)
          s=s.replace('Detective v0.10 ·','Detective v0.11 ·',1)
          p.write_text(s)
          PY
      - name: Validate fixed dimensions
        shell: bash
        run: |
          grep -q 'position:absolute;inset:0;width:100%;height:100%' web/detective/index.html
          grep -q 'height:min(58vh,560px);min-height:0;max-height:58vh' web/detective/index.html
          grep -q 'id="photoModeBtn"' web/detective/index.html
          grep -q 'id="filmModeBtn"' web/detective/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Fix Detective camera preview height on mobile'
          git push
