name: Build Detective Collector v0.14 fixes

on:
  push:
    paths:
      - '.github/workflows/detective-v014-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python tools/patch_detective_collector_v014.py
      - name: Validate Collector
        shell: bash
        run: |
          grep -q 'Detective Collector v0.14' web/detective/index.html
          grep -q '+ till aktiv serie' web/detective/index.html
          ! grep -q '>DOKUMENT</text>' web/detective/index.html
          ! grep -q '>SERIER</text>' web/detective/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('web/detective/index.html').read_text()
          a=s.index('<script>')+8
          b=s.index('</script>')
          Path('/tmp/detective.js').write_text(s[a:b])
          PY
          node --check /tmp/detective.js
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Fix Collector illustration and restore archive reuse'
          git push
