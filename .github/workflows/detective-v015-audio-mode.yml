name: Build Detective Collector v0.15 audio mode
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v015.py'
      - '.github/workflows/detective-v015-audio-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audio mode
        run: python tools/patch_detective_collector_v015.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/detective/index.html').read_text()
          assert 'audioModeBtn' in s
          assert '>Ljud</button>' in s
          assert 'Spela in ljudspår</button>' not in s
          assert "cameraMode==='audio'" in s
          assert 'Detective Collector v0.15' in s
          print('validation ok')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit audio mode
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Make audio a third Detective Collector capture mode'
          git push
