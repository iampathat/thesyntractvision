name: Build Detective Collector v0.16 voice pause
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v016.py'
      - '.github/workflows/detective-v016-voice-pause.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply voice pause
        run: python tools/patch_detective_collector_v016.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert 'Röst pausad' in s
          assert 'resumeVoiceAfterCapture' in s
          assert 'Detective Collector v0.16' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit voice pause
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Pause voice controls during Detective recording'
          git push
