name: Build Detective Collector v0.17 photo voice memory
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v017.py'
      - '.github/workflows/detective-v017-photo-voice-memory.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply photo voice memory
        run: python tools/patch_detective_collector_v017.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert 'photoVoiceOn' in s
          assert 'voicePill.forcedOff:disabled' in s
          assert "cameraMode!=='photo'" in s
          assert 'Detective Collector v0.17' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit photo voice memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Remember Detective voice state for photo mode'
          git push
