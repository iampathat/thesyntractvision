name: Build Detective Collector v0.22 series and storage
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v022.py'
      - '.github/workflows/detective-v022-series-storage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.22 UX
        run: python tools/patch_detective_collector_v022.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert 'Aktiv serie' in s
          assert 'Byt serie' in s
          assert 'Skapa ny serie' in s
          assert 'GB totalt' in s
          assert '% använt' in s
          assert 'Detective Collector v0.22' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit v0.22
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Clarify Detective Collector series flow and storage status'
          git push
