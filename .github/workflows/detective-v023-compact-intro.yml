name: Build Detective Collector v0.23 compact intro
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v023.py'
      - '.github/workflows/detective-v023-compact-intro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact intro UX
        run: python tools/patch_detective_collector_v023.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert 'collectorHero simpleHero' in s
          assert 'Privat lokalt arkiv · original + arbetskopior' in s
          assert 'collectorSteps' not in s[s.index('<section class="collectorHero simpleHero">'):s.index('</section>',s.index('<section class="collectorHero simpleHero">'))]
          assert 'collectorLegend' not in s[s.index('<section class="collectorHero simpleHero">'):s.index('</section>',s.index('<section class="collectorHero simpleHero">'))]
          assert 'Detective Collector v0.23' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit compact intro UX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Simplify Detective Collector intro'
          git push
