name: Build Detective Collector v0.24 title only
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v024.py'
      - '.github/workflows/detective-v024-title-only.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply title-only UX
        run: python tools/patch_detective_collector_v024.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert '<section class="titleOnlyHero">' in s
          block=s[s.index('<section class="titleOnlyHero">'):s.index('</section>',s.index('<section class="titleOnlyHero">'))]
          assert 'collectorLead' not in block
          assert 'simpleArchiveBadge' not in block
          assert 'collectorMark' not in block
          assert 'Detective Collector v0.24' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit title-only UX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Reduce Detective Collector intro to title only'
          git push
