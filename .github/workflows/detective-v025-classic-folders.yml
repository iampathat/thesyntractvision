name: Build Detective Collector v0.25 classic folders
on:
  push:
    paths:
      - 'tools/patch_detective_collector_v025.py'
      - '.github/workflows/detective-v025-classic-folders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply classic folder/series/tag UX
        run: python tools/patch_detective_collector_v025.py
      - name: Validate Collector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/detective/index.html').read_text()
          assert 'classicSetup' in s
          assert 'id="folderSelect"' in s
          assert 'id="seriesTags"' in s
          assert '＋ Ny mapp' in s
          assert '＋ Ny serie' in s
          assert 'Detective Collector v0.25' in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/detective.js').write_text(js)
          PY
          node --check /tmp/detective.js
      - name: Commit v0.25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Use classic folders series and tags in Detective Collector'
          git push
