name: Patch Detective v0.9 camera UI

on:
  push:
    paths:
      - '.github/workflows/detective-v09-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_detective_v09.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('web/detective/index.html').read_text()
          a=s.index('<script>')+8
          b=s.index('</script>')
          Path('/tmp/detective.js').write_text(s[a:b])
          PY
          node --check /tmp/detective.js
          ! grep -q 'camera.off:before' web/detective/index.html
          grep -q 'id="filmModeBtn"' web/detective/index.html
          grep -q 'function startFilm' web/detective/index.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/detective/index.html
          git commit -m 'Fix Detective camera status and add photo-film mode'
          git push
