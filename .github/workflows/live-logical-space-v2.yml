name: Live Logical Space V2

on:
  push:
    branches:
      - test/logical-space-live-v2

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: First live run
        run: |
          rm -rf intelligence_store
          qcds-logical-robot examples/first_logical_robot_mvp.json --store ./intelligence_store --max-cycles 6 | tee /tmp/run1.json
          echo '--- logical_space.csv after run 1 ---'
          cat intelligence_store/logical_space.csv || true
          echo '--- evidence.csv after run 1 ---'
          cat intelligence_store/first-logical-robot-demo/evidence.csv || true
          echo '--- current_oracles.csv after run 1 ---'
          cat intelligence_store/first-logical-robot-demo/current_oracles.csv || true
      - name: Restart resume run
        run: |
          qcds-logical-robot examples/first_logical_robot_mvp.json --store ./intelligence_store --max-cycles 6 | tee /tmp/run2.json
          echo '--- logical_space.csv after run 2 ---'
          cat intelligence_store/logical_space.csv || true
          echo '--- evidence.csv after run 2 ---'
          cat intelligence_store/first-logical-robot-demo/evidence.csv || true
