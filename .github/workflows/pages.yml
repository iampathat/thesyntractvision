name: Cally.One Pages handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-owned-by-main:
    runs-on: ubuntu-latest
    steps:
      - name: Explain publication boundary
        run: |
          echo 'GitHub Pages publication is owned by the main-branch Pages workflow.'
          echo 'Cally.One is built from tribute after Cally.One Tribute tests complete successfully.'
          echo 'This prevents either product surface from overwriting the other.'
