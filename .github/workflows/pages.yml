name: Living Logical Robot + Cally.One Pages

on:
  push:
    branches: [tribute]
    paths:
      - "src/qcds_fabric/**"
      - "robots/legal/sweden_housing/**"
      - "web/session_core_worker.js"
      - "web/assets/**"
      - "CALENDAR_ROBOT.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.configure.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate real Pick a World QCDS spaces
        run: |
          python - <<'PY'
          from qcds_fabric.pick_a_world_core import CASES, run_pick_world_case

          results = {case_id: run_pick_world_case(case_id) for case_id in CASES}
          for case_id, result in results.items():
              assert result["logical_width"] == 12, (case_id, result["logical_width"])
              assert result["candidate_binary_space"] == "2^12", (case_id, result["candidate_binary_space"])
              assert result["browser_pre_scoring"] is False
          robotics = results["robotics"]
          assert set(robotics["leading_candidates"]) == {"direct", "cautious"}
          assert robotics["world_binding"] is None
          assert robotics["binding_status"] == "unresolved_tie"
          print({case_id: {"leaders": result["leading_candidates"], "binding": result["binding_status"], "space": result["candidate_binary_space"]} for case_id, result in results.items()})
          PY
      - name: Validate Robotics Playground through SyntractSystem
        run: |
          python - <<'PY'
          import json
          from qcds_fabric.robotics_playground_system import run_robotics_playground_system_json

          def run(payload):
              return json.loads(run_robotics_playground_system_json(json.dumps(payload)))

          clear = run({"width":20,"height":12,"start":[1,6],"goal":[18,6],"blocked":[]})
          assert clear["reachable"] is True
          assert clear["shortest_steps"] == 17
          assert clear["shortest_path_count"] == 1
          assert clear["logical_width"] == 8
          assert clear["candidate_binary_space"] == "2^8"
          assert clear["system_boundary"] == "SyntractSystem"
          assert clear["qcds_core_execution"] is True
          assert clear["separate_pathfinder"] is False

          changed = run({"width":20,"height":12,"start":[1,6],"goal":[18,6],"blocked":[[9,6]]})
          assert changed["reachable"] is True
          assert changed["shortest_steps"] == 19
          assert changed["shortest_path_count"] > 1
          assert changed["oracle_summary"]["drawn_obstacles"] == 1

          wall = run({"width":20,"height":12,"start":[1,6],"goal":[18,6],"blocked":[[9,y] for y in range(12)]})
          assert wall["reachable"] is False
          assert wall["shortest_path_count"] == 0
          print({"core": clear["execution"], "space": clear["candidate_binary_space"], "clear": clear["shortest_steps"], "one_oracle": changed["shortest_steps"], "wall_reachable": wall["reachable"]})
          PY
      - name: Validate Cally.One Logical Robot boundary
        run: |
          python - <<'PY'
          from qcds_fabric.robots.cally_one.robot import CallyOneService
          from qcds_fabric.robots.cally_one.ui import cally_one_html
          from tempfile import TemporaryDirectory

          with TemporaryDirectory() as root:
              service = CallyOneService(root)
              state = service.state()
              assert state["product"] == "Cally.One"
              assert state["provenance"]["logical_robot"] is True
              assert state["provenance"]["system_boundary"] == "SyntractSystem"
              assert state["provenance"]["shared_qcds_core"] is True
          html = cally_one_html(static_mode=True)
          assert "Cally.One" in html
          assert "cally_one_run" in html
          assert "qcds_fabric.zip" in html
          print("Cally.One Logical Robot boundary verified")
          PY
      - name: Export public QCDS surfaces
        run: |
          mkdir -p _site/legal/cases _site/assets _site/cally
          python -m qcds_fabric.living_robot_public --export _site/index.html
          cp web/session_core_worker.js _site/session_core_worker.js
          cp robots/legal/sweden_housing/cases/*.json _site/legal/cases/
          cp web/assets/syntract_art.svg _site/assets/syntract_art.svg
          cp web/assets/syntract_art_lockup.svg _site/assets/syntract_art_lockup.svg
          cp web/assets/syntract_brand105.css _site/assets/syntract_brand105.css
          cp web/assets/syntract_brand105.js _site/assets/syntract_brand105.js
          cp web/assets/syntract_super120.css _site/assets/syntract_super120.css
          cp web/assets/syntract_super*.js _site/assets/
          cp web/assets/syntract_public_shell.css _site/assets/syntract_public_shell.css
          cp web/assets/syntract_public_shell.js _site/assets/syntract_public_shell.js
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          from qcds_fabric.robots.cally_one.ui import cally_one_html

          root = Path('src/qcds_fabric')
          with ZipFile('_site/qcds_fabric.zip', 'w', compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.suffix in {'.py', '.json'}:
                      archive.write(path, path.relative_to('src'))

          Path('_site/cally/index.html').write_text(cally_one_html(static_mode=True), encoding='utf-8')

          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          cache_tag = (os.environ.get('GITHUB_SHA') or 'dev')[:12]
          styles = (
              '<link rel="stylesheet" href="assets/syntract_brand105.css">',
              '<link rel="stylesheet" href="assets/syntract_super120.css">',
              f'<link rel="stylesheet" href="assets/syntract_public_shell.css?v={cache_tag}">',
          )
          scripts = (
              '<script defer src="assets/syntract_brand105.js"></script>',
              '<script defer src="assets/syntract_super108.js"></script>',
              '<script defer src="assets/syntract_super109.js"></script>',
              '<script defer src="assets/syntract_super110.js"></script>',
              '<script defer src="assets/syntract_super111.js"></script>',
              '<script defer src="assets/syntract_super112.js"></script>',
              '<script defer src="assets/syntract_super113.js"></script>',
              '<script defer src="assets/syntract_super114.js"></script>',
              '<script defer src="assets/syntract_super115.js"></script>',
              '<script defer src="assets/syntract_super116.js"></script>',
              '<script defer src="assets/syntract_super117.js"></script>',
              '<script defer src="assets/syntract_super118.js"></script>',
              '<script defer src="assets/syntract_super119.js"></script>',
              '<script defer src="assets/syntract_super120.js"></script>',
              f'<script defer src="assets/syntract_public_shell.js?v={cache_tag}"></script>',
          )
          for css in styles:
              if css not in html:
                  html = html.replace('</head>', css + '\n</head>', 1)
          for js in scripts:
              if js not in html:
                  html = html.replace('</body>', js + '\n</body>', 1)
          page.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Validate Cally.One Pages surface
        run: |
          test -s _site/cally/index.html
          test -s _site/session_core_worker.js
          test -s _site/qcds_fabric.zip
          grep -F 'Cally.One' _site/cally/index.html
          grep -F 'cally_one_run' _site/cally/index.html
          grep -F 'localStorage' _site/cally/index.html
          grep -F 'qcds_fabric.robots.cally_one.robot' _site/session_core_worker.js
          grep -F "msg.type === 'cally_one_run'" _site/session_core_worker.js
      - name: Validate Syntract artwork public identity
        run: |
          test -s _site/assets/syntract_art.svg
          test -s _site/assets/syntract_art_lockup.svg
          grep -F 'assets/syntract_brand105.css' _site/index.html
          grep -F 'assets/syntract_brand105.js' _site/index.html
          grep -F 'syntract_art.svg' _site/assets/syntract_brand105.js
      - name: Validate public presentation assets
        run: |
          test -s _site/assets/syntract_super120.css
          for n in 108 109 110 111 112 113 114 115 116 117 118 119 120; do
            test -s "_site/assets/syntract_super${n}.js"
            grep -F "assets/syntract_super${n}.js" _site/index.html
          done
          test -s _site/assets/syntract_public_shell.css
          test -s _site/assets/syntract_public_shell.js
          grep -F 'assets/syntract_public_shell.css?v=' _site/index.html
          grep -F 'assets/syntract_public_shell.js?v=' _site/index.html
          grep -F 'qcdsCoreReimplemented:false' _site/assets/syntract_public_shell.js
      - name: Validate exact public release artifact
        run: python -m qcds_fabric.public_release_guard --site _site
      - name: Validate Superbuild architecture boundary
        run: python -m qcds_fabric.superbuild_release_guard --site _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain Pages enablement
        if: steps.configure.outcome != 'success'
        run: |
          echo '### GitHub Pages is not enabled yet' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Living Logical Robot + Cally.One site was built and uploaded successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
