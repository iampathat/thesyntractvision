name: Living Logical Robot Pages

on:
  push:
    branches: [main]
    paths:
      - "src/qcds_fabric/**"
      - "robots/legal/sweden_housing/**"
      - "web/session_core_worker.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.configure.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Export the compact public Logical Robot + full Swedish Legal QCDS Robot
        run: |
          mkdir -p _site/legal/cases
          python -m qcds_fabric.living_robot_public_compact --export _site/index.html
          cp web/session_core_worker.js _site/session_core_worker.js
          cp robots/legal/sweden_housing/cases/*.json _site/legal/cases/
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('src/qcds_fabric')
          with ZipFile('_site/qcds_fabric.zip', 'w', compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.suffix in {'.py', '.json'}:
                      archive.write(path, path.relative_to('src'))
          PY
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain first-time Pages enablement
        if: steps.configure.outcome != 'success'
        run: |
          echo '### GitHub Pages is not enabled yet' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Living Logical Robot and full Swedish Legal QCDS Robot were built and uploaded successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
