name: QCDS Cycling visual test loop
on:
  workflow_dispatch:
  push:
    paths:
      - 'qcds-medcare-cycling/**'
      - '.github/workflows/qcds-cycling-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate joint QCDS world oracles and executable road-terrain geometry
        run: |
          node qcds-medcare-cycling/world-oracles.test.mjs
          node qcds-medcare-cycling/world-mesh.test.mjs
          node qcds-medcare-cycling/world-water.test.mjs
          node qcds-medcare-cycling/water-topology.test.mjs
          node qcds-medcare-cycling/water-seams.test.mjs
          node qcds-medcare-cycling/world-coherence.test.mjs
          node qcds-medcare-cycling/forest-oracles.test.mjs
          node qcds-medcare-cycling/camera-rig.test.mjs
          node qcds-medcare-cycling/ci-evidence.regression.test.mjs
      - name: Install headless Chromium and Playwright
        run: |
          mkdir -p /tmp/qcds-browser-qa
          cd /tmp/qcds-browser-qa
          npm init -y
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
          ./node_modules/.bin/playwright --version
          ln -sfn /tmp/qcds-browser-qa/node_modules "$GITHUB_WORKSPACE/qcds-medcare-cycling/node_modules"
      - name: Verify browser dependencies before launching the app
        run: |
          node -e "const {chromium}=require('/tmp/qcds-browser-qa/node_modules/playwright'); (async()=>{const browser=await chromium.launch({headless:true,args:['--no-sandbox']});console.log('Chromium launched:',browser.version());await browser.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Start local cycling website
        run: |
          python3 -m http.server 8765 --directory qcds-medcare-cycling > /tmp/cycling-server.log 2>&1 &
          echo $! > /tmp/cycling-server.pid
      - name: Start demo, toggle QCDS WebGL and capture evidence
        run: node qcds-medcare-cycling/visual-smoke.mjs
      - name: Build and verify real offline WASM diagnostic
        run: |
          node qcds-medcare-cycling/build-offline-wasm.mjs
          node qcds-medcare-cycling/offline-wasm-smoke.mjs
      - name: Preserve browser install and server diagnostics
        if: failure()
        run: |
          mkdir -p qcds-medcare-cycling/visual-evidence
          cp -f /tmp/cycling-server.log qcds-medcare-cycling/visual-evidence/server.log 2>/dev/null || true
          find "$HOME/.npm/_logs" -maxdepth 1 -name '*debug-0.log' -type f -print -exec cp {} qcds-medcare-cycling/visual-evidence/ \; 2>/dev/null || true
          df -h > qcds-medcare-cycling/visual-evidence/disk.txt
          node --version > qcds-medcare-cycling/visual-evidence/node.txt
          ls -la /tmp/qcds-browser-qa > qcds-medcare-cycling/visual-evidence/browser-install.txt 2>&1 || true
      - name: Publish auditable CI and visual evidence summary
        if: always()
        env:
          QCDS_JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='qcds-medcare-cycling/visual-evidence/results.json';
          let result=null, evidenceError='';
          try {
            if(fs.existsSync(path)) result=JSON.parse(fs.readFileSync(path,'utf8'));
            else evidenceError='results.json missing';
          } catch(e) { evidenceError='results.json unreadable: '+e.message; }
          const evidenceFiles=['01-initial.png','02-demo.png','03-qcds-webgl.png','04-fixed-camera.png','05-random-camera.png','06-two-camera-checkpoint.png'];
          const evidence=evidenceFiles.map(name=>{
            const file='qcds-medcare-cycling/visual-evidence/'+name;
            return name+': '+(fs.existsSync(file)?fs.statSync(file).size+' bytes':'MISSING');
          });
          const lines=[
            '# QCDS Cycling — CI and visual evidence',
            '',
            '| Field | Value |',
            '| --- | --- |',
            '| Commit | `'+process.env.GITHUB_SHA+'` |',
            '| Run | '+process.env.GITHUB_RUN_ID+' (attempt '+process.env.GITHUB_RUN_ATTEMPT+') |',
            '| Event | '+process.env.GITHUB_EVENT_NAME+' |',
            '| Job status | '+process.env.QCDS_JOB_STATUS+' |',
            '| Browser evidence | '+(result?'results.json produced':'MISSING — browser smoke did not produce results.json')+' |',
            '| WebGL2 | '+(result?.result?.webgl2===true?'confirmed': 'not confirmed')+' |',
            '| WebGL error | '+(result?.result?.webglError===0?'GL_NO_ERROR':'not confirmed / '+String(result?.result?.webglError ?? 'missing'))+' |',
            '| Runtime errors | '+(result?.errors?.length ?? 'unknown')+' |',
            '| Console errors | '+(result?.consoleErrors?.length ?? 'unknown')+' |',
            '| Canvas visible | '+(result?.result?.visible===true?'confirmed':'not confirmed')+' |',
            '| Dual camera | '+(result?.cameraMetadata&&result?.randomEvidence?'fixed + seeded random captured':'not confirmed')+' |',
            '| Camera seed | '+String(result?.cameraMetadata?.cameraSeed||'missing')+' |',
            '| Visual realism | NOT VERIFIED — screenshots require comparison with reference |',
            '',
            '### Browser steps',
            ...((result?.steps||[]).map(x=>'- '+String(x))),
            '',
            '### Screenshot files',
            ...evidence.map(x=>'- '+x),
            '',
            '### Errors',
            ...(evidenceError?['- '+evidenceError]:[]),
            ...((result?.errors||[]).concat(result?.consoleErrors||[],result?.failure?[result.failure]:[]).map(x=>'- '+String(x).replace(/\n/g,' '))),
            '',
            'Screenshots and results.json are attached in the **qcds-cycling-visual-evidence** artifact, when produced.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Export machine-readable CI run metadata even on failure
        if: always()
        env:
          QCDS_JOB_STATUS: ${{ job.status }}
        run: node qcds-medcare-cycling/ci-evidence.mjs
      - name: Fail closed if WebGL or two-camera evidence is incomplete
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const p='qcds-medcare-cycling/visual-evidence/run-metadata.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(m.browserEvidenceComplete,true,'WebGL browser evidence incomplete');
          assert.equal(m.twoCameraEvidenceComplete,true,'Two-camera screenshots or seeds not verified');
          assert.ok(m.commit && /^[0-9a-f]{40}$/.test(m.commit),'Commit SHA missing');
          assert.equal(m.commit,process.env.GITHUB_SHA,'Evidence commit does not match checkout');
          assert.ok(m.screenshots.every(s=>s.validPng && s.sha256),'Screenshot integrity failed');
          console.log('QCDS evidence gate PASS',m.commit,m.runId);
          NODE
      - name: Verify decoded pixels differ across QCDS camera captures
        run: |
          node qcds-medcare-cycling/png-pixel-evidence.mjs \
            qcds-medcare-cycling/visual-evidence/04-fixed-camera.png \
            qcds-medcare-cycling/visual-evidence/05-random-camera.png
      - name: Bundle exact checked-out QCDS source for local reproducibility
        if: always()
        run: |
          mkdir -p qcds-medcare-cycling/visual-evidence
          tar --exclude='node_modules' --exclude='visual-evidence' -czf qcds-medcare-cycling/visual-evidence/qcds-source.tar.gz -C qcds-medcare-cycling .
          sha256sum qcds-medcare-cycling/visual-evidence/qcds-source.tar.gz > qcds-medcare-cycling/visual-evidence/qcds-source.sha256
          printf '%s\n' "$GITHUB_SHA" > qcds-medcare-cycling/visual-evidence/source-commit.txt
      - name: Upload screenshots and runtime errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcds-cycling-visual-evidence
          path: qcds-medcare-cycling/visual-evidence/
          if-no-files-found: warn
