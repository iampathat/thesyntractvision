name: QCDS Cycling visual test loop
on:
  workflow_dispatch:
  push:
    paths:
      - 'qcds-medcare-cycling/**'
      - '.github/workflows/qcds-cycling-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium and Playwright
        run: |
          mkdir -p /tmp/qcds-browser-qa
          cd /tmp/qcds-browser-qa
          npm init -y
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
          ./node_modules/.bin/playwright --version
          ln -s /tmp/qcds-browser-qa/node_modules qcds-medcare-cycling/node_modules
      - name: Verify browser dependencies before launching the app
        run: |
          node -e "const {chromium}=require('/tmp/qcds-browser-qa/node_modules/playwright'); (async()=>{const browser=await chromium.launch({headless:true,args:['--no-sandbox']});console.log('Chromium launched:',browser.version());await browser.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Start local cycling website
        run: |
          python3 -m http.server 8765 --directory qcds-medcare-cycling > /tmp/cycling-server.log 2>&1 &
          echo $! > /tmp/cycling-server.pid
      - name: Start demo, toggle QCDS WebGL and capture evidence
        run: node qcds-medcare-cycling/visual-smoke.mjs
      - name: Preserve browser install and server diagnostics
        if: failure()
        run: |
          mkdir -p qcds-medcare-cycling/visual-evidence
          cp -f /tmp/cycling-server.log qcds-medcare-cycling/visual-evidence/server.log 2>/dev/null || true
          find "$HOME/.npm/_logs" -maxdepth 1 -name '*debug-0.log' -type f -print -exec cp {} qcds-medcare-cycling/visual-evidence/ \; 2>/dev/null || true
          df -h > qcds-medcare-cycling/visual-evidence/disk.txt
          node --version > qcds-medcare-cycling/visual-evidence/node.txt
          ls -la /tmp/qcds-browser-qa > qcds-medcare-cycling/visual-evidence/browser-install.txt 2>&1 || true
      - name: Upload screenshots and runtime errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcds-cycling-visual-evidence
          path: qcds-medcare-cycling/visual-evidence/
          if-no-files-found: warn
