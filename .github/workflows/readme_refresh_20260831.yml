name: One-time README refresh

on:
  push:
    paths:
      - '.github/workflows/readme_refresh_20260831.yml'
      - 'scripts/refresh_readme_20260831.py'

permissions:
  contents: write

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare guarded README update
        run: python scripts/refresh_readme_20260831.py
      - name: Validate and commit README
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            echo 'README already current; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update README for Visual Logical Robot and current Syntract system'
          git push
