name: Sync public Build 95 marker

on:
  push:
    paths:
      - '.github/workflows/sync_build95_marker.yml'

permissions:
  contents: write

jobs:
  sync-marker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set stable public build marker
        run: |
          grep -F 'PUBLIC_BUILD = "93"' src/qcds_fabric/living_robot_public.py
          sed -i 's/PUBLIC_BUILD = "93"/PUBLIC_BUILD = "95"/' src/qcds_fabric/living_robot_public.py
          grep -F 'PUBLIC_BUILD = "95"' src/qcds_fabric/living_robot_public.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/qcds_fabric/living_robot_public.py
          git commit -m 'BUILD 95: sync stable public marker'
          git push
