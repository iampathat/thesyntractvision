name: Sync public Build 96

on:
  push:
    paths:
      - '.github/workflows/sync_build96_marker.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Build 96 presentation layer
        run: |
          grep -F 'from .living_robot_public_visual87 import living_robot_public_visual87_html as _base_html' src/qcds_fabric/living_robot_public.py
          sed -i 's/from \.living_robot_public_visual87 import living_robot_public_visual87_html as _base_html/from .living_robot_public_visual96 import living_robot_public_visual96_html as _base_html/' src/qcds_fabric/living_robot_public.py
          sed -i 's/PUBLIC_BUILD = "95"/PUBLIC_BUILD = "96"/' src/qcds_fabric/living_robot_public.py
          grep -F 'from .living_robot_public_visual96 import living_robot_public_visual96_html as _base_html' src/qcds_fabric/living_robot_public.py
          grep -F 'PUBLIC_BUILD = "96"' src/qcds_fabric/living_robot_public.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/qcds_fabric/living_robot_public.py
          git commit -m 'BUILD 96: make desktop Robotics presentation-fit'
          git push
