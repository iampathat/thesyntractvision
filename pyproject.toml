[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcds-fabric"
version = "1.9.0"
description = "Reference implementation scaffold for QCDS Fabric v1.0"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Patrik Sundblom"}]

[project.scripts]
qcds-logical-robot = "qcds_fabric.logical_space:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
