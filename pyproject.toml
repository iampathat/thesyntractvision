[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcds-fabric"
version = "1.28.0"
description = "Reference implementation scaffold for QCDS Fabric v1.0"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Patrik Sundblom"}]

[project.scripts]
qcds-logical-robot = "qcds_fabric.logical_space:main"
qcds-universe = "qcds_fabric.logical_universe_runner:main"
qcds-reality-cycle = "qcds_fabric.self_expanding_reality:main"
qcds-reality-discovery = "qcds_fabric.evidence_driven_reality:main"
qcds-observe = "qcds_fabric.logical_robot_live38:main"
qcds-live = "qcds_fabric.logical_robot_live38:main"
qcds-reality-web = "qcds_fabric.public_web_reality:main"
qcds-reality-grow = "qcds_fabric.continuous_reality:main"
qcds-domain-lab = "qcds_fabric.domain_lab_cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
