<linearGradient id="featherBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcffff"/><stop offset=".33" stop-color="#8cd5fe"/><stop offset=".59" stop-color="#115895"/><stop offset=".8" stop-color="#89dcff"/><stop offset="1" stop-color="#edffff"/></linearGradient>
<linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a34"/><stop offset=".55" stop-color="#267bac"/><stop offset="1" stop-color="#caefff"/></linearGradient>
<radialGradient id="gw-eagle-node"><stop stop-color="#fff"/><stop offset=".4" stop-color="#7fe8ff"/><stop offset="1" stop-color="#078dff"/></radialGradient>
<filter id="gw-bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="gw-softglow" x="-110%" y="-110%" width="320%" height="320%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
