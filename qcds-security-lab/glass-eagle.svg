<?xml version="1.0" encoding="UTF-8"?>
<svg class="glasswing-eagle-asset" viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gw-title gw-desc">
    <title id="gw-title">Project Glasswing — the crystalline QCDS security eagle</title>
    <desc id="gw-desc">An unmistakable blue-white glass eagle flies with broad flapping wings. Cyan, blue, lime, and violet inference nodes light up inside its translucent body and feathers, deflecting incoming attacks.</desc>
          <style>
  /* Animations live inside the SVG: works on the Home page without intro CSS. */
  .gw-eagle { filter: drop-shadow(0 0 12px rgba(136,233,255,.85)); }
  .gw-protection { opacity:.85; animation:gw-shield-pulse 2.6s ease-in-out infinite; transform-origin:480px 235px; }
  .gw-circuit circle,.gw-wing-nodes circle { filter:drop-shadow(0 0 7px #8cf1ff); animation:gw-node-light 1.3s ease-in-out infinite alternate; }
  .gw-wing-nodes circle:nth-child(2n) { animation-delay:.55s; }
  .gw-neon-bolt { opacity:1;stroke-dasharray:18 32;filter:drop-shadow(0 0 6px currentColor);animation:gw-lightning 1.65s linear infinite; }
  .gw-neon-bolt-left { animation-delay:.1s; }
  .gw-neon-bolt-right { animation-delay:.72s; }
  .gw-core-bolt { opacity:1;stroke-dasharray:10 17;animation:gw-lightning 1.1s linear infinite; }
  .gw-impact { opacity:.8;animation:gw-shield-hit 1.65s ease-out infinite;transform-box:fill-box;transform-origin:center; }
  .gw-impact-right {animation-delay:.6s}
  .gw-shield-flash {opacity:.65;animation:gw-defense-flash 1.6s ease-in-out infinite}
  .gw-attacks {animation:gw-threat-move 2.2s linear infinite}
  .gw-deflection { filter:drop-shadow(0 0 9px rgba(115,250,255,.85));}
  @keyframes gw-lightning { 0%{opacity:.16;stroke-dashoffset:120} 20%{opacity:1} 50%{opacity:.28;stroke-dashoffset:10} 62%{opacity:1} 100%{opacity:.13;stroke-dashoffset:-130} }
  @keyframes gw-node-light {from{opacity:.45}to{opacity:1}}
  @keyframes gw-shield-pulse {from{opacity:.5}to{opacity:1}}
  @keyframes gw-shield-hit {0%{opacity:0;transform:scale(.5)}30%{opacity:1}65%{opacity:.75;transform:scale(1.6)}100%{opacity:0;transform:scale(2)}}
  @keyframes gw-defense-flash {0%,65%,100%{opacity:.1}25%,47%{opacity:1}}
  @keyframes gw-threat-move {from{stroke-dashoffset:125}to{stroke-dashoffset:-125}}
  @media (prefers-reduced-motion: reduce) {
    * {animation:none !important}
    .gw-neon-bolt,.gw-core-bolt,.gw-impact {opacity:.75}
  }
</style>
<defs>
            <linearGradient id="gw-eagle-glass" x1="110" y1="90" x2="825" y2="370" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F5FFFF" stop-opacity=".98"/>
              <stop offset=".22" stop-color="#B8F3FF" stop-opacity=".91"/>
              <stop offset=".46" stop-color="#488EBC" stop-opacity=".89"/>
              <stop offset=".72" stop-color="#D0F6FF" stop-opacity=".92"/>
              <stop offset="1" stop-color="#F0FFFF" stop-opacity=".96"/>
            </linearGradient>
            <linearGradient id="gw-eagle-rim" x1="105" y1="95" x2="855" y2="320" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F6FFFF"/><stop offset=".46" stop-color="#50DFFF"/><stop offset=".72" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B5F7FF"/>
            </linearGradient>
            <radialGradient id="gw-eagle-node"><stop stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8FCFF"/><stop offset="1" stop-color="#35ADFF"/></radialGradient>
            <filter id="gw-eagle-bloom" x="-80%" y="-80%" width="260%" height="260%">
