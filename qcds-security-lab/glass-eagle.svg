<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="gw-title gw-desc">
<title id="gw-title">Project Glasswing — crystalline cyber eagle with glowing defensive network</title>
<desc id="gw-desc">A sharp-eyed blue-white glass eagle with jagged crystal feathers, extended metallic talons, flapping wings, and flashing cyan, lime and violet protective nodes.</desc>
<style>
.gw-eagle {filter:drop-shadow(0 0 10px rgba(67,195,255,.8))}
.gw-neon-bolt,.gw-core-bolt{stroke-dasharray:20 30;animation:gw-arcs 1.65s linear infinite}
.gw-neon-bolt-right{animation-delay:.45s}.gw-core-bolt{animation-delay:.75s}
.gw-left-network circle,.gw-right-network circle{animation:gw-nodes 1s ease-in-out infinite alternate}
.gw-protection{animation:gw-shield 2.5s ease-in-out infinite}
.gw-impact{animation:gw-impact 2.2s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes gw-arcs{0%{opacity:.35;stroke-dashoffset:120}35%{opacity:1;stroke-dashoffset:32}65%{opacity:.32;stroke-dashoffset:0}100%{opacity:.8;stroke-dashoffset:-110}}
@keyframes gw-nodes{from{opacity:.45}to{opacity:1}}
@keyframes gw-shield{from{opacity:.36}to{opacity:1}}
@keyframes gw-impact{0%{transform:scale(.6);opacity:0}38%{opacity:1}100%{transform:scale(1.7);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}animateTransform{display:none!important}}
</style>
<defs>
<linearGradient id="gw-eagle-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8feff"/><stop offset=".18" stop-color="#a8e8ff"/><stop offset=".48" stop-color="#2476b7"/><stop offset=".72" stop-color="#d8f9ff"/><stop offset="1" stop-color="#eefeff"/></linearGradient>
