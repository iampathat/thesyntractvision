    <!-- Layout safety net stays inside HTML: an older offline stylesheet must
         never turn the small Home mark into an oversized natural-size image. -->
    <style id="gw-critical-layout-v126">
      /* Critical structural fallback if an installed offline stylesheet is stale. */
      html,body,#app {max-width:100%;min-width:0}
      img,video {max-width:100%}
      #gw-film {position:fixed;inset:0;z-index:25010;background:#020e1b}
      #gw-film[hidden]{display:none!important}
      #app .consumer-home .gw-lab-heading-mark {
        display:block!important;width:64px!important;height:64px!important;
        max-width:64px!important;max-height:64px!important;
        flex:0 0 64px!important;object-fit:contain!important
      }
      #app .consumer-home .gw-lab-heading,
      #app .consumer-home .gw-lab-heading-main {min-width:0;max-width:100%}
      @media(max-width:1024px){
        #app .question-position,#app .question-navigation {
          position:static!important;inset:auto!important;z-index:auto!important
        }
        #app .consumer-bottom-nav {
          position:fixed!important;bottom:0;left:0;right:0;
          z-index:90!important;background:#061e32!important;
          backdrop-filter:none!important
        }
        #app .app-body>main {
          padding-bottom:calc(115px + env(safe-area-inset-bottom,0px))!important
        }
        #app .consumer-bottom-nav a[aria-current] {
          background:#143b58!important;color:#bff7ff!important
        }
      }
    </style>
