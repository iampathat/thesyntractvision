[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcds-fabric-4-2"
version = "4.2.0a1"
description = "Executable research track for QCDS Fabric 4.2 rotational bias-resistant inference"
requires-python = ">=3.11"
authors = [{name = "Patrik Sundblom"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
